# Pane controls
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n M-2 run-shell -b "~/.config/tmux/scripts/even-horizontal-panes 2 '#{window_id}' '#{pane_id}'"
bind -n M-3 run-shell -b "~/.config/tmux/scripts/even-horizontal-panes 3 '#{window_id}' '#{pane_id}'"
bind -n M-4 run-shell -b "~/.config/tmux/scripts/even-horizontal-panes 4 '#{window_id}' '#{pane_id}'"
bind -n M-5 run-shell -b "~/.config/tmux/scripts/even-horizontal-panes 5 '#{window_id}' '#{pane_id}'"
bind -n M-6 run-shell -b "~/.config/tmux/scripts/even-horizontal-panes 6 '#{window_id}' '#{pane_id}'"
bind -n M-7 run-shell -b "~/.config/tmux/scripts/even-horizontal-panes 7 '#{window_id}' '#{pane_id}'"
bind -n M-8 run-shell -b "~/.config/tmux/scripts/even-horizontal-panes 8 '#{window_id}' '#{pane_id}'"
bind -n M-9 run-shell -b "~/.config/tmux/scripts/even-horizontal-panes 9 '#{window_id}' '#{pane_id}'"

# Alt+Enter evens every window in this session and lays panes that are not already one horizontal row into one.
bind -n M-Enter run-shell -b "~/.config/tmux/scripts/equalize-panes '#{window_id}'"

unbind -n M-p
bind -n M-p copy-mode
bind -n M-o select-pane -t :.+
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-K resize-pane -U 5
bind -n M-J resize-pane -D 5
bind -n "M-|" split-window -v -c "#{pane_current_path}"
bind -n "M-\\" split-window -h -c "#{pane_current_path}"
bind -n "M-c" kill-pane
bind -n M-Home split-window -h -c "#{pane_current_path}"
bind -n M-End split-window -v -c "#{pane_current_path}"
bind -n M-DC kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Ctrl+click is tmux's built-in swap-pane. A trackpad tap while Ctrl is held flips panes.
unbind -n C-MouseDown1Pane
