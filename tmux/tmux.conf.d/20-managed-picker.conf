# Managed tesseract session picker
unbind -n "__TMUX_INDEX_KEY__"
unbind -n "C-i"
unbind -n "Tab"
unbind -n "C-Insert"
unbind -n "Insert"
unbind -n "F8"
unbind -n "F9"
unbind -n "F12"
unbind -n "M-h"
unbind -n "M-|"
unbind -n "M-\\"
unbind -n "M-c"
unbind -n "M--"
unbind -n "M-v"
unbind -n "M-Home"
unbind -n "M-End"
unbind -n "M-DC"
bind -n "__TMUX_INDEX_KEY__" run-shell "TMUX_CLIENT_TTY='#{client_tty}' \"__TM_PUBLIC_LAUNCHER__\" open picker >/dev/null 2>&1"
