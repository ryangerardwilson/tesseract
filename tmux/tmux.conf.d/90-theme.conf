# Theme
set -g status-style "bg=default,fg=default"

# Load tmux colors from the active Omarchy theme when provided.
if-shell '[ -f ~/.config/omarchy/current/theme/tmux.conf ]' 'source-file ~/.config/omarchy/current/theme/tmux.conf'

# Override themed status-left/right so session and host labels do not appear.
set -g status-left ""
set -g status-right ""
set-window-option -g window-status-format " "
set-window-option -g window-status-current-format " "
set-option -g status-format[0] "#[align=left]#{status-left}#[align=right]#{status-right}"
